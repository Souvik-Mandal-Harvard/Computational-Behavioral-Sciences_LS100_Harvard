version: 1
project:
  id: ls100-computational-behavioral-sciences
  title: 'Computational Behavioral Sciences'
  subtitle: Foundations of Data Science and Applied AI/ML for Conducting Research in Behavioral Sciences
  description: >-
    A research-based Harvard course on quantifying the behavior of humans and other animals using Python, computer vision, audio analysis, and statistics.
  # Authors are declared per-file (in each .md / .ipynb) so the byline can differ
  # per contributor and isn't duplicated by a project-wide author block.
  github: https://github.com/Souvik-Mandal-Harvard/Computational-Behavioral-Sciences_LS100_Harvard
  license:
    content: CC-BY-NC-4.0
  open_access: true
  # Files that are built but not part of the student-facing navigation
  exclude:
    - README.md
  toc:
    - file: site/index.md
    - file: site/start-here.md
    - file: site/how-to-run.md
    - title: Modules
      children:
        - file: LS100_00A_Research-Plans-And-Proposals/Module-00A_Research-Plans-And-Proposals.md
          children:
            - file: LS100_00A_Research-Plans-And-Proposals/LS100_module-00A_Research_content-01_Guide-01_Writing-Research-Plans-And-Proposals.md
        - file: LS100_00B_Python-Fundamentals/Module-00B_Python-Fundamentals.md
          children:
            - file: LS100_00B_Python-Fundamentals/LS100_module-00B_content-01_Guide-01_Getting-Started-with-Python_LastUpdated-20260601.md
            - file: LS100_00B_Python-Fundamentals/LS100_module-00B_content-02_Guide-02_Essential-Python-Terminologies-and-Concepts_LastUpdated-20260110.md
            - pattern: 'LS100_00B_Python-Fundamentals/*.ipynb'
        - file: LS100_01A_Video-data/Module-01A_Video-Data.md
          children:
            - file: LS100_01A_Video-data/LS100_module-01A_Video-Data_content-00_Guide-01_Introduction-to-Digital-Video-Python_LastUpdated-20260726.md
            - pattern: 'LS100_01A_Video-data/*.ipynb'
        - file: LS100_01B_Audio-Data/Module-01B_Audio-Data.md
          children:
            - file: LS100_01B_Audio-Data/LS100_module-01B_Audio-Data_content-00_Guide-01_Introduction-to-Digital-Audio-Python_LastUpdated-20260612.md
            - pattern: 'LS100_01B_Audio-Data/*.ipynb'
        - file: LS100_02_Data-Science_Stats/Module-02_Data-Science-and-Statistics.md
          children:
            - file: LS100_02_Data-Science_Stats/LS100_module-02_content-01_Guide01_Navigational-Guide-to-Statistical-Methods_LastUpdated-20260616.md
            - pattern: 'LS100_02_Data-Science_Stats/*.ipynb'
        - file: LS100_03_Communication-and-Presentation/Module-03_Communication-and-Presentation.md
          children:
            - file: LS100_03_Communication-and-Presentation/LS100_module-03_Research_Content01_Guide01_Art-of-Communicating-Science_LastUpdated-20251108.md
    - file: LS100_Career-Guide01_Data-Careers.md
      title: Career Guide — Data Careers
    - file: site/reading-guides.md
    - file: site/project-ideas.md
    - file: site/curriculum.md
    - file: site/about.md
site:
  template: book-theme
  # Distinct from the landing page's title so the browser/social-card title
  # reads "LS100: Computational Behavioral Sciences — <this>" instead of doubling.
  title: 'Foundations of Data Science & Applied AI/ML for Behavioral Research'
  options:
    style: site/_static/ls100.css
    hide_outline: false
    logo_text: Home
  parts:
    primary_sidebar_footer: site/parts/sidebar-footer.md
  nav: []
  actions:
    - title: GitHub
      url: https://github.com/Souvik-Mandal-Harvard/Computational-Behavioral-Sciences_LS100_Harvard
