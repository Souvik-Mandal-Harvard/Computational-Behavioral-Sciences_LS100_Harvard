# Build the MyST (Jupyter Book) site + per-guide PDFs and publish it.
#
# ── ACTIVE: Option B — serve at souvikmandal.info/ls100/ ──────────────────────
#   On every push to main, this builds the HTML in the cloud and pushes it into
#   the `page` repo under /teaching-learning/ls100 (clean-replaced each deploy).
#   Requires a deploy secret: PAGE_REPO_DEPLOY_KEY (see the deployment runbook).
#
#   To fall back to Option A (publish to THIS repo's own GitHub Pages, no secret),
#   see the commented block at the bottom of this file.

name: Build & Deploy LS100 site
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Site is served from the /ls100 sub-path of souvikmandal.info
  BASE_URL: /teaching-learning/ls100

permissions:
  contents: read

concurrency:
  group: ls100-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so "Last updated" dates are correct
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install MyST Markdown
        run: npm install -g mystmd
      - name: Setup Typst (for PDF guides)
        uses: typst-community/setup-typst@v4

      # Build PDFs first so the HTML build can attach them as download buttons.
      - name: Refresh notebook run-buttons (Colab/Codespaces/Download) from current paths
        run: python3 scripts/refresh_run_buttons.py .
      - name: Stamp "Last updated" date on articles (from git)
        run: python3 scripts/inject_last_updated.py .
      - name: Build PDF guides
        run: myst build --pdf
        # Non-fatal: if a guide PDF fails, the site still ships.
        continue-on-error: true
      - name: Stamp source URL on guide PDFs (vertical, left margin)
        run: |
          python3 -m pip install --quiet pypdf reportlab pyyaml
          PDF_SOURCE_BASE="https://souvikmandal.info${BASE_URL}" python3 scripts/stamp_pdf_source.py .
      - name: Build HTML site
        run: myst build --html
      - name: Make built filenames GitHub-Pages-safe ($ [ ] ( ) -> safe)
        run: python3 scripts/gh_pages_safe_filenames.py _build/html

      # Publish into the page repo, REPLACING teaching-learning/ls100 cleanly each
      # time (so renamed pages don't accumulate as orphans) while leaving the rest
      # of the personal site untouched. Serves at souvikmandal.info/teaching-learning/ls100/
      - name: Deploy into page repo /teaching-learning/ls100
        env:
          DEPLOY_KEY: ${{ secrets.PAGE_REPO_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"
          git clone --depth 1 --branch main git@github.com:Souvik-Mandal-Harvard/page.git page_repo
          rm -rf page_repo/teaching-learning/ls100
          mkdir -p page_repo/teaching-learning/ls100
          cp -a _build/html/. page_repo/teaching-learning/ls100/
          touch page_repo/.nojekyll
          cd page_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy LS100 site ($(date -u +%FT%TZ))" || { echo "No changes to deploy"; exit 0; }
          git push origin main

# ─────────────────────────────────────────────────────────────────────────────
# OPTION A (fallback) — publish to THIS repo's own GitHub Pages, no secret needed.
# URL: https://souvik-mandal-harvard.github.io/Computational-Behavioral-Sciences_LS100_Harvard/
# To use it: set env BASE_URL to /Computational-Behavioral-Sciences_LS100_Harvard,
# remove the "Deploy into page repo /ls100" step above, add `pages: write` and
# `id-token: write` to permissions, and append these steps to the job:
#
#      - name: Setup Pages
#        uses: actions/configure-pages@v3
#      - name: Upload artifact
#        uses: actions/upload-pages-artifact@v3
#        with:
#          path: ./_build/html
#      - name: Deploy to GitHub Pages
#        uses: actions/deploy-pages@v4
#  …and in the repo: Settings → Pages → Source = "GitHub Actions".
# ─────────────────────────────────────────────────────────────────────────────
