# Reproducibility check.
#
# On every push this re-runs each notebook from top to bottom in a fresh
# Python session (like "Restart & Run All"). Notebooks with "GPU" in their file
# name are NOT re-run (GitHub's machines have no GPU); for those we only check
# that they were saved with outputs. See .github/scripts/check_notebooks.py.
#
# This also powers the "reproducible" badge in README.md, so anyone viewing the
# project can see at a glance that the analysis re-runs from scratch.
# You never need to edit this file.

name: Reproducibility check
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg   # draw plots without a screen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nbclient nbformat

      - name: Run notebooks and check outputs
        run: python .github/scripts/check_notebooks.py
